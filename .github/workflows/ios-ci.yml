name: Cross-Platform KMP & iOS Simulator CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shared-and-android:
    name: KMP Shared Tests & Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Shared Multiplatform Tests
        run: ./gradlew :shared:allTests --stacktrace

      - name: Run Android Unit Tests & Debug Build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  ios-simulator-build-and-test:
    name: macOS iOS Simulator Build & Test
    runs-on: macos-14
    needs: shared-and-android
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.2.app
          fi
          xcodebuild -version

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build KMP iOS Framework (SharedCore)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Resolve and Boot Target iOS Simulator
        id: sim
        run: |
          xcrun simctl list devices available
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone (15|16|14|SE)" | grep -oE "[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}" | head -1)
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep -oE "[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}" | head -1)
          fi
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          echo "Selected Simulator UUID: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true

      - name: Build iOS Application for Simulator
        run: |
          xcodebuild \
            -project iosApp/ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -configuration Debug \
            -destination "id=$SIM_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log || (echo "=== XCODEBUILD FAILED LOG ===" && cat build.log | tail -n 120 && exit 1)

      - name: Execute iOS Unit Tests on Simulator
        run: |
          xcodebuild test \
            -project iosApp/ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -destination "id=$SIM_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log || (echo "=== XCODEBUILD TEST FAILED LOG ===" && cat test.log | tail -n 120 && exit 1)

      - name: Package Simulator App for Web & Virtual Testing (Appetize.io / Simulator)
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Debug-iphonesimulator/ExpenseTracker.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "ExpenseTracker.app" -type d | head -1)
          fi
          echo "Found compiled app at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

          # Guarantee Info.plist is inside the app bundle
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Info.plist missing in app bundle. Copying from iosApp/Info.plist..."
            cp iosApp/Info.plist "$APP_PATH/Info.plist"
          fi
          plutil -lint "$APP_PATH/Info.plist"

          echo "=== APP BUNDLE CONTENTS ==="
          ls -la "$APP_PATH"

          # Create clean Appetize-ready zip (-X strips macOS extended attributes)
          cd "$(dirname "$APP_PATH")"
          zip -r -X "$GITHUB_WORKSPACE/ExpenseTracker-Simulator.zip" ExpenseTracker.app
          cd "$GITHUB_WORKSPACE"

          echo "=== ZIP ARCHIVE VERIFICATION ==="
          unzip -l ExpenseTracker-Simulator.zip | head -n 35

      - name: Upload Single-Layer Appetize Ready Zip
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-Appetize
          path: ${{ env.APP_PATH }}

      - name: Upload Simulator Zip Archive
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-Simulator-Archive
          path: ExpenseTracker-Simulator.zip

      - name: Publish Direct Simulator Download to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-simulator
          name: "Expense Tracker iOS Simulator Build"
          body: "Direct Appetize.io-ready iOS Simulator build. Download ExpenseTracker-Simulator.zip and drop it into Appetize.io directly (no extra unzipping required)."
          files: ExpenseTracker-Simulator.zip
